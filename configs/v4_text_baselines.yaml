# Zero-shot text baselines: frozen Llama reads the serialized graph (no graph tokens). The checkpoint only satisfies the backend; text-only conditions never use its weights
# Generated by scripts/make_v4_configs.py; edit the script, not this file.
seed: 42
output_dir: outputs/v4_text_baselines
data_dir: datasets/metro_v4_1
gpu_memory_fraction: 0.97
data:
  distribution: metro_v4
  static_train_graphs: 2000
  static_tuples_per_graph: 9
  counterfactual_graphs: 1000
  counterfactual_pairs_per_graph: 3
  static_validation_replicates: 6
  static_test_replicates: 12
  sessions:
    validation_replicates: 1
    test_replicates: 1
  static_tasks:
  - edge_exists
  - reachability
  - constrained_reachability
  - cycle_membership
  - node_degree
  - filtered_neighbor_count
  - shortest_path
  - within_hops_count
  - most_common_attribute_within_hops
  - attribute_lookup
  - attribute_check
  dynamic_tasks:
  - edge_exists
  - reachability
  - constrained_reachability
  - cycle_membership
  - node_degree
  - filtered_neighbor_count
  - shortest_path
  - within_hops_count
  - most_common_attribute_within_hops
model:
  backend: tea
  architecture: graph_token
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  tensorizer: bert
  bert_model_name: bert-base-uncased
  node_feature_size: 768
  graph_hidden_size: 1024
  graph_output_size: 4096
  graph_layers: 3
  graph_dropout: 0.0
  graph_aggregation: sum
  prefix_tokens: 10
  projector_num_layers: 1
  trust_remote_code: false
  torch_dtype: bfloat16
  gradient_checkpointing: true
  checkpoint: outputs/v4_graphtoken_s42/projector/checkpoint-best
evaluation:
  splits:
  - test
  batch_size: 32
  max_new_tokens: 32
  checkpoint: best
  encoder_autocast: match_training
  conditions:
  - serialized_current_graph
  - serialized_initial_history
  - token_matched_history
