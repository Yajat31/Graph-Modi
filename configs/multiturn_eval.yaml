seed: 314
output_dir: outputs/multiturn_eval

data:
  train_sessions: 0
  validation_sessions: 200
  test_sessions: 1000
  node_count_min: 15
  node_count_max: 30
  turns: [1, 2, 3, 5]
  reasoning_types:
    - shortest_path
    - reachability
    - filtered_neighbor_count
    - cycle_membership

model:
  backend: tea
  lm_name: Qwen/Qwen3-8B
  checkpoint: outputs/qwen8b/projector/checkpoint-final
  graph_hidden_size: 256
  graph_layers: 4
  prefix_tokens: 8
  node_feature_size: 12

evaluation:
  splits: [test]
  max_new_tokens: 32
  conditions:
    - question_only
    - frozen_graph_history
    - shuffled_graph
    - oracle_updated_graph
    - cached_no_reencode
    - predicted_updated_graph
    - serialized_initial_history
    - token_matched_history
    - serialized_current_graph
    - tool_solver
