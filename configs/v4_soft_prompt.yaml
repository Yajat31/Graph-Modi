# Graph-blind soft-prompt control
# Generated by scripts/make_v4_configs.py; edit the script, not this file.
seed: 42
output_dir: outputs/v4_soft_prompt
data_dir: datasets/metro_v4_1
gpu_memory_fraction: 0.97
data:
  distribution: metro_v4
  static_train_graphs: 2000
  static_tuples_per_graph: 9
  counterfactual_graphs: 1000
  counterfactual_pairs_per_graph: 3
  static_validation_replicates: 6
  static_test_replicates: 12
  sessions:
    validation_replicates: 1
    test_replicates: 1
  static_tasks:
  - edge_exists
  - reachability
  - constrained_reachability
  - cycle_membership
  - node_degree
  - filtered_neighbor_count
  - shortest_path
  - within_hops_count
  - most_common_attribute_within_hops
  - attribute_lookup
  - attribute_check
  dynamic_tasks:
  - edge_exists
  - reachability
  - constrained_reachability
  - cycle_membership
  - node_degree
  - filtered_neighbor_count
  - shortest_path
  - within_hops_count
  - most_common_attribute_within_hops
model:
  backend: soft_prompt
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  prefix_tokens: 10
  trust_remote_code: false
  torch_dtype: bfloat16
  gradient_checkpointing: true
training:
  seed: 42
  epochs: 1
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_accumulation_steps: 3
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null
  wrap_prompts: true
evaluation:
  splits:
  - test
  batch_size: 64
  max_new_tokens: 32
  checkpoint: final
  encoder_autocast: match_training
  conditions:
  - soft_prompt
  - soft_prompt_no_history
