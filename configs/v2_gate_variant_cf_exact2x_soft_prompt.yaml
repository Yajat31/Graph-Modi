seed: 42
output_dir: outputs/v2_gate_variant_cf_exact2x_soft_prompt
data_dir: datasets/metro_v2_gate_variant_cf_exact2x

data:
  distribution: metro_v2_preliminary
  dynamic_only: true
  session_layout: exact_uniform
  exact_uniform:
    validation_replicates: 1
    test_replicates: 1
  train_sessions: 0
  ood_sessions: 0
  static_tasks: [edge_exists, reachability, cycle_membership]
  dynamic_tasks: [edge_exists, reachability, cycle_membership]
  counterfactual_static_train: true

model:
  backend: soft_prompt
  lm_name: /home/arihantr/models/Meta-Llama-3.1-8B-Instruct
  prefix_tokens: 10
  trust_remote_code: false
  torch_dtype: bfloat16
  checkpoint: outputs/v2_gate_variant_cf_soft_prompt/soft_prompt/checkpoint-final

training:
  seed: 42
  epochs: 5
  batch_size: 24
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  mixed_precision: bf16

evaluation:
  splits: [validation, test]
  batch_size: 16
  max_new_tokens: 32
  conditions:
    - soft_prompt
