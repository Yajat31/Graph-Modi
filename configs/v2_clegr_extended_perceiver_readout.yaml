seed: 42
output_dir: outputs/v2_clegr_extended_perceiver
data_dir: datasets/metro_v2_clegr_extended
# Same dataset as v2_clegr_extended_tea.yaml / v2_clegr_extended_aspect_readout.yaml
# so all three are directly comparable; this experiment only changes
# model/training.

data:
  distribution: metro_v2_preliminary
  train_sessions: 0
  validation_sessions: 150
  test_sessions: 350
  ood_sessions: 250
  static_train_graphs: 2000
  static_validation_graphs: 250
  static_test_graphs: 500
  static_tuples_per_graph: 9
  static_tasks:
    [
      edge_exists,
      node_degree,
      reachability,
      cycle_membership,
      filtered_neighbor_count,
      filtered_path_count,
      shortest_path,
      path_cost,
      constrained_reachability,
      within_hops_count,
      within_hops_list,
      most_common_attribute_within_hops,
    ]
  dynamic_tasks:
    [
      reachability,
      edge_exists,
      cycle_membership,
      filtered_neighbor_count,
      path_cost,
      constrained_reachability,
      within_hops_count,
      most_common_attribute_within_hops,
    ]
  counterfactual_static_train: true

model:
  backend: tea
  architecture: tea
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  graph_hidden_size: 4096
  graph_layers: 8
  graph_aggregation: sum
  node_feature_size: 64
  trust_remote_code: false
  torch_dtype: bfloat16
  # Own GNN checkpoint dir, trained from scratch for this probe -- separate
  # from both v2_clegr_extended_tea's and v2_clegr_extended_aspect's.
  gnn_checkpoint: outputs/v2_clegr_extended_perceiver/gnn/gnn.pt

# perceiver_readout: resampler hyperparameters, read by
# scripts/train_perceiver_readout_from_scratch.py (not by the main cli.py
# pipeline).
perceiver_readout:
  num_queries: 10
  num_heads: 4
  num_layers: 2
  ff_hidden_dim: 512

training:
  seed: 42
  gnn_epochs: 30
  gnn_learning_rate: 0.002
  gnn_batch_size: 64
  epochs: 10
  batch_size: 8
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_accumulation_steps: 3
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null

evaluation:
  splits: [validation, test, ood]
  batch_size: 96
  max_new_tokens: 96
  conditions:
    - question_only
    - frozen_graph_history
    - graph_once_then_text
    - shuffled_graph
    - oracle_updated_graph
    - cached_no_reencode
    - predicted_updated_graph
    - serialized_initial_history
    - token_matched_history
    - serialized_current_graph
    - tool_solver
    - structure_only
    - modify_and_print
    - majority_prior
