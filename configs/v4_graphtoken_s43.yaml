# GraphToken (joint GNN + projector), sum aggregation
# Generated by scripts/make_v4_configs.py; edit the script, not this file.
seed: 43
output_dir: outputs/v4_graphtoken_s43
data_dir: datasets/metro_v4_1
gpu_memory_fraction: 0.97
data:
  distribution: metro_v4
  static_train_graphs: 2000
  static_tuples_per_graph: 9
  counterfactual_graphs: 1000
  counterfactual_pairs_per_graph: 3
  static_validation_replicates: 6
  static_test_replicates: 12
  sessions:
    validation_replicates: 1
    test_replicates: 1
  static_tasks:
  - edge_exists
  - reachability
  - constrained_reachability
  - cycle_membership
  - node_degree
  - filtered_neighbor_count
  - shortest_path
  - within_hops_count
  - most_common_attribute_within_hops
  - attribute_lookup
  - attribute_check
  dynamic_tasks:
  - edge_exists
  - reachability
  - constrained_reachability
  - cycle_membership
  - node_degree
  - filtered_neighbor_count
  - shortest_path
  - within_hops_count
  - most_common_attribute_within_hops
model:
  backend: tea
  architecture: graph_token
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  tensorizer: bert
  bert_model_name: bert-base-uncased
  node_feature_size: 768
  graph_hidden_size: 1024
  graph_output_size: 4096
  graph_layers: 3
  graph_dropout: 0.0
  graph_aggregation: sum
  prefix_tokens: 10
  projector_num_layers: 1
  trust_remote_code: false
  torch_dtype: bfloat16
  gradient_checkpointing: true
training:
  seed: 43
  epochs: 1
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_accumulation_steps: 3
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null
  lr_schedule: cosine
  warmup_steps: 200
  min_lr_ratio: 0.05
  eval_every_steps: 100
  val_max_examples: 1000
  wrap_prompts: true
  gnn_learning_rate_joint: 0.0001
evaluation:
  splits:
  - test
  batch_size: 32
  max_new_tokens: 32
  checkpoint: best
  encoder_autocast: match_training
  conditions:
  - oracle_updated_graph
  - predicted_updated_graph
  - structure_only
  - frozen_graph_history
  - shuffled_graph
  - question_only
  - stale_answer
  - majority_answer
  - tool_solver
