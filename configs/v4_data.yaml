# generate metro_v4 data (and nothing else)
seed: 42
output_dir: outputs/v4_data
data_dir: datasets/metro_v4
gpu_memory_fraction: 0.97

data:
  distribution: metro_v4
  # metro_v4: corrected benchmark (data/v4.py); not comparable with v3
  static_train_graphs: 2000
  static_tuples_per_graph: 9
  counterfactual_graphs: 1000
  counterfactual_pairs_per_graph: 3
  static_validation_replicates: 6
  static_test_replicates: 12
  sessions:
    validation_replicates: 1
    test_replicates: 1
  static_tasks:
    [
      edge_exists,
      reachability,
      constrained_reachability,
      cycle_membership,
      node_degree,
      filtered_neighbor_count,
      shortest_path,
      within_hops_count,
      most_common_attribute_within_hops,
      attribute_lookup,
      attribute_check,
    ]
  dynamic_tasks:
    [
      edge_exists,
      reachability,
      constrained_reachability,
      cycle_membership,
      node_degree,
      filtered_neighbor_count,
      shortest_path,
      within_hops_count,
      most_common_attribute_within_hops,
    ]
