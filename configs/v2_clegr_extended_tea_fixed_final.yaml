seed: 42
output_dir: outputs/v2_clegr_extended_tea_fixed_final
data_dir: datasets/metro_v2_clegr_extended_fixed_final
gpu_memory_fraction: 0.90

# "Fixed final" run: matches the CLEGR paper's own GraphSAGE dims exactly
# (clegr.md Table 3: In 768 / Hidden 1024 / Out 1024 / Layers 3 / Dropout
# 0.5), uses TEA-GLM's real contrastive-alignment pretraining objective
# (arXiv:2408.14512) instead of this project's earlier answer-classification
# proxy, feeds W(f_i) (node attribute text, fixed at the render_question
# source so training and eval stay consistent), and keeps the
# task-conditional pooling fix (pool only when no source/target anchor is
# present, matching the paper's node-level vs. graph-level Eq. 1/Eq. 2
# switch). data_dir is new (not reused) specifically so _ensure_data
# regenerates fresh sessions with W(f_i) baked into every cached question.

data:
  distribution: metro_v2_preliminary
  train_sessions: 0
  validation_sessions: 150
  test_sessions: 350
  ood_sessions: 250
  static_train_graphs: 2000
  static_validation_graphs: 250
  static_test_graphs: 500
  static_tuples_per_graph: 9
  static_tasks:
    [
      edge_exists,
      node_degree,
      reachability,
      cycle_membership,
      filtered_neighbor_count,
      filtered_path_count,
      shortest_path,
      path_cost,
      constrained_reachability,
      within_hops_count,
      within_hops_list,
      most_common_attribute_within_hops,
    ]
  dynamic_tasks:
    [
      reachability,
      edge_exists,
      cycle_membership,
      filtered_neighbor_count,
      path_cost,
      constrained_reachability,
      within_hops_count,
      most_common_attribute_within_hops,
    ]
  counterfactual_static_train: true

model:
  backend: tea
  architecture: tea
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  tensorizer: bert
  bert_model_name: bert-base-uncased
  node_feature_size: 768
  graph_hidden_size: 1024
  graph_layers: 3
  graph_dropout: 0.5
  graph_aggregation: mean
  prefix_tokens: 10
  projector_num_layers: 1
  trust_remote_code: false
  torch_dtype: bfloat16
  gradient_checkpointing: true
  gnn_checkpoint: outputs/v2_clegr_extended_tea_fixed_final/gnn/gnn.pt

training:
  seed: 42
  pretrain_objective: contrastive
  gnn_epochs: 10
  gnn_learning_rate: 0.001
  gnn_graphs_per_batch: 8
  contrastive_temperature: 0.07
  epochs: 3
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_accumulation_steps: 6
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null

evaluation:
  splits: [validation, test, ood]
  batch_size: 32
  max_new_tokens: 96
  conditions:
    - question_only
    - frozen_graph_history
    - graph_once_then_text
    - shuffled_graph
    - oracle_updated_graph
    - cached_no_reencode
    - predicted_updated_graph
    - serialized_initial_history
    - token_matched_history
    - serialized_current_graph
    - tool_solver
    - structure_only
    - modify_and_print
    - majority_prior
