seed: 42
output_dir: outputs/llama3_1_8b
data_dir: datasets/watts_strogatz_metro_v1

data:
  train_sessions: 10000
  validation_sessions: 1000
  test_sessions: 2000
  distribution: watts_strogatz_metro_v1
  graph_degree: 4
  rewire_probability: 0.15
  line_count: 4
  node_count_min: 15
  node_count_max: 30
  turns: [1, 2, 3, 5]
  reasoning_types:
    - shortest_path
    - reachability
    - filtered_neighbor_count
    - cycle_membership

model:
  backend: tea
  lm_name: /home/arihantr/models/Meta-Llama-3.1-8B-Instruct
  graph_hidden_size: 4096
  graph_layers: 8
  graph_aggregation: sum
  prefix_tokens: 8
  projector_num_layers: 1
  node_feature_size: 12
  trust_remote_code: false
  torch_dtype: bfloat16
  gnn_checkpoint: outputs/llama3_1_8b/gnn/gnn.pt

training:
  seed: 42
  gnn_epochs: 20
  gnn_learning_rate: 0.002
  gnn_batch_size: 128
  epochs: 5
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null

evaluation:
  splits: [validation, test]
  max_new_tokens: 32
  conditions:
    - question_only
    - frozen_graph_history
    - graph_once_then_text
    - shuffled_graph
    - oracle_updated_graph
    - cached_no_reencode
    - predicted_updated_graph
    - serialized_initial_history
    - token_matched_history
    - serialized_current_graph
    - tool_solver
