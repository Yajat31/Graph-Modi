seed: 42
output_dir: outputs/v2_smoke

data:
  distribution: metro_v2_preliminary
  train_sessions: 6
  validation_sessions: 2
  test_sessions: 4
  ood_sessions: 2
  static_train_graphs: 4
  static_validation_graphs: 2
  static_test_graphs: 2
  static_tuples_per_graph: 4

model:
  backend: mock
  architecture: tea
  lm_name: mock
  graph_hidden_size: 32
  graph_layers: 2
  prefix_tokens: 10
  node_feature_size: 12

training:
  seed: 42
  epochs: 1
  batch_size: 2
  learning_rate: 0.001
  gradient_accumulation_steps: 1
  mixed_precision: "no"

evaluation:
  splits: [test, ood]
  batch_size: 4
  pilot_sessions: 4
  seeds: [42, 43, 44]
  conditions:
    - question_only
    - frozen_graph_history
    - graph_once_then_text
    - oracle_updated_graph
    - predicted_updated_graph
    - soft_prompt
    - structure_only
    - modify_and_print
    - tool_solver
    - majority_prior
