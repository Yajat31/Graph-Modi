seed: 42
output_dir: outputs/v2_gate_variant_cf_soft_prompt
data_dir: datasets/metro_v2_gate_variant_cf

data:
  distribution: metro_v2_preliminary
  train_sessions: 0
  validation_sessions: 150
  test_sessions: 350
  ood_sessions: 250
  static_train_graphs: 2000
  static_validation_graphs: 250
  static_test_graphs: 500
  static_tuples_per_graph: 9
  # Same task-balance restriction + counterfactual static training as
  # configs/v2_gate_variant_cf_tea.yaml -- same dataset, same corpus, so this
  # baseline is directly comparable to TEA/GraphToken in the same report.
  static_tasks: [edge_exists, reachability, cycle_membership]
  dynamic_tasks: [reachability, edge_exists, cycle_membership]
  counterfactual_static_train: true

model:
  backend: soft_prompt
  lm_name: /home/arihantr/models/Meta-Llama-3.1-8B-Instruct
  prefix_tokens: 10
  trust_remote_code: false
  torch_dtype: bfloat16

training:
  seed: 42
  epochs: 5
  batch_size: 24
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null

evaluation:
  splits: [validation, test, ood]
  batch_size: 96
  max_new_tokens: 32
  conditions:
    - soft_prompt
