seed: 42
output_dir: outputs/v2_gate_variant_cf_factorial_soft_prompt
data_dir: datasets/metro_v2_gate_variant_cf_factorial

data:
  distribution: metro_v2_preliminary
  dynamic_only: true
  session_layout: factorial
  sessions_per_cell:
    validation: 2
    test: 20
  train_sessions: 0
  ood_sessions: 0
  static_tasks: [edge_exists, reachability, cycle_membership]
  dynamic_tasks: [reachability, edge_exists, cycle_membership]
  counterfactual_static_train: true

model:
  backend: soft_prompt
  lm_name: /home/arihantr/models/Meta-Llama-3.1-8B-Instruct
  prefix_tokens: 10
  trust_remote_code: false
  torch_dtype: bfloat16
  checkpoint: outputs/v2_gate_variant_cf_soft_prompt/soft_prompt/checkpoint-final

training:
  seed: 42
  epochs: 5
  batch_size: 24
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  mixed_precision: bf16

evaluation:
  splits: [validation, test]
  batch_size: 96
  max_new_tokens: 32
  conditions:
    - soft_prompt
