seed: 42
output_dir: outputs/v2_clegr_extended_graphtoken_fixed_final
data_dir: datasets/metro_v2_clegr_extended_fixed_final
gpu_memory_fraction: 0.97

# GraphToken fixed-final: CLEGR Table 3 gives G-Token(GSAGE) the SAME GraphSAGE
# dims as TEA-GLM (768/1024/1024/3 layers/0.5 dropout), so this reuses the
# already-pretrained+validated GNN checkpoint from
# configs/v2_clegr_extended_tea_fixed_final.yaml verbatim (same tensorizer,
# same GraphSAGEConfig -- required for _load_local_gnn's strict shape check
# to pass) rather than re-pretraining. Same data_dir as TEA fixed-final for
# direct comparability (W(f_i) is baked in at the data-gen source already).

data:
  distribution: metro_v2_preliminary
  train_sessions: 0
  validation_sessions: 150
  test_sessions: 350
  ood_sessions: 250
  static_train_graphs: 2000
  static_validation_graphs: 250
  static_test_graphs: 500
  static_tuples_per_graph: 9
  static_tasks:
    [
      edge_exists,
      node_degree,
      reachability,
      cycle_membership,
      filtered_neighbor_count,
      filtered_path_count,
      shortest_path,
      path_cost,
      constrained_reachability,
      within_hops_count,
      within_hops_list,
      most_common_attribute_within_hops,
    ]
  dynamic_tasks:
    [
      reachability,
      edge_exists,
      cycle_membership,
      filtered_neighbor_count,
      path_cost,
      constrained_reachability,
      within_hops_count,
      most_common_attribute_within_hops,
    ]
  counterfactual_static_train: true

model:
  backend: tea
  architecture: graph_token
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  tensorizer: bert
  bert_model_name: bert-base-uncased
  node_feature_size: 768
  graph_hidden_size: 1024
  graph_layers: 3
  graph_dropout: 0.5
  graph_aggregation: mean
  prefix_tokens: 10
  projector_num_layers: 1
  trust_remote_code: false
  torch_dtype: bfloat16
  gradient_checkpointing: true
  gnn_checkpoint: outputs/v2_clegr_extended_tea_fixed_final/gnn/gnn.pt

training:
  seed: 42
  epochs: 3
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_accumulation_steps: 6
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null

evaluation:
  splits: [validation, test, ood]
  batch_size: 32
  max_new_tokens: 96
  conditions:
    - question_only
    - frozen_graph_history
    - graph_once_then_text
    - shuffled_graph
    - oracle_updated_graph
    - cached_no_reencode
    - predicted_updated_graph
    - serialized_initial_history
    - token_matched_history
    - serialized_current_graph
    - tool_solver
    - structure_only
    - modify_and_print
    - majority_prior
