seed: 42
output_dir: outputs/v3csv_soft_prompt
data_dir: datasets/metro_v3
gpu_memory_fraction: 0.97

data:
  distribution: metro_v3
  prompt_format: csv
  # 12-22 stations, CLEGR-style node semantics, label-balanced (data/v3.py)
  static_train_graphs: 2000
  static_tuples_per_graph: 9
  counterfactual_graphs: 1000
  counterfactual_pairs_per_graph: 3
  static_validation_replicates: 6
  static_test_replicates: 12
  sessions:
    validation_replicates: 1
    test_replicates: 1
  static_tasks:
    [
      edge_exists,
      reachability,
      constrained_reachability,
      cycle_membership,
      node_degree,
      filtered_neighbor_count,
      shortest_path,
      within_hops_count,
      most_common_attribute_within_hops,
      attribute_lookup,
      attribute_check,
    ]
  dynamic_tasks:
    [
      edge_exists,
      reachability,
      constrained_reachability,
      cycle_membership,
      node_degree,
      filtered_neighbor_count,
      shortest_path,
      within_hops_count,
      most_common_attribute_within_hops,
    ]

model:
  backend: soft_prompt
  lm_name: /data/lmw/models/Meta-Llama-3.1-8B-Instruct
  prefix_tokens: 10
  trust_remote_code: false
  torch_dtype: bfloat16
  max_sequence_length: 2048
  graph_token_position: prefix
  prompt_template: "[INST]\n{question}\n[/INST]"
  gradient_checkpointing: true

training:
  seed: 42
  epochs: 1
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_accumulation_steps: 12
  mixed_precision: bf16
  save_every_steps: 500
  resume_from: null

evaluation:
  splits: [validation, test]
  batch_size: 16
  max_new_tokens: 32
  conditions:
    - oracle_updated_graph
