[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-modi"
version = "0.1.0"
description = "Controlled multi-turn graph modification experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Hansraj" }]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tea = [
  "accelerate>=1.0",
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.45",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
gpu = [
  "accelerate>=1.0",
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.scripts]
graph-modi = "graph_modi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_modi"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["graph_modi"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["graph_modi.models.tea_glm"]
ignore_errors = true
